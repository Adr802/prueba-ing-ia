x-agent: &agent
  env_file: .env
  volumes:
    - ./config:/config:ro
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-mcp-build: &mcp-build
  context: .
  dockerfile: docker/mcp.Dockerfile

x-agent-build: &agent-build
  context: .
  dockerfile: docker/agent.Dockerfile

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic onboarding.trace --partitions 3 --replication-factor 1
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    container_name: orchestrator
    env_file: .env
    environment:
      AGENT_IDENTITY_URL: http://agent-identity:8101/invoke
      AGENT_RISK_URL: http://agent-risk:8102/invoke
      AGENT_RESPONSE_URL: http://agent-response:8103/invoke
      AGENT_DOCS_URL: http://agent-docs:8104/invoke
    volumes:
      - ./config:/config:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      agent-identity:
        condition: service_started
      agent-risk:
        condition: service_started
      agent-docs:
        condition: service_started
      agent-response:
        condition: service_started
    ports:
      - "8000:8000"

  agent-identity:
    <<: *agent
    build:
      <<: *agent-build
      additional_contexts:
        app: services/agent-identity/app
    container_name: agent-identity
    environment:
      PORT: 8101
      MCP_URL: http://mcp-clients:8201/mcp
    ports:
      - "8101:8101"

  agent-risk:
    <<: *agent
    build:
      <<: *agent-build
      additional_contexts:
        app: services/agent-risk/app
    container_name: agent-risk
    environment:
      PORT: 8102
      MCP_URL: http://mcp-risk:8202/mcp
    ports:
      - "8102:8102"

  agent-response:
    <<: *agent
    build:
      <<: *agent-build
      additional_contexts:
        app: services/agent-response/app
    container_name: agent-response
    environment:
      PORT: 8103
    ports:
      - "8103:8103"

  agent-docs:
    <<: *agent
    build:
      <<: *agent-build
      additional_contexts:
        app: services/agent-docs/app
    container_name: agent-docs
    environment:
      PORT: 8104
      MCP_URL: http://mcp-docs:8203/mcp
    ports:
      - "8104:8104"

  mcp-clients:
    build:
      <<: *mcp-build
      additional_contexts:
        app: services/mcp-clients/app
    container_name: mcp-clients
    environment:
      PORT: 8201
    ports:
      - "8201:8201"

  mcp-risk:
    build:
      <<: *mcp-build
      additional_contexts:
        app: services/mcp-risk/app
    container_name: mcp-risk
    environment:
      PORT: 8202
    ports:
      - "8202:8202"

  mcp-docs:
    build:
      <<: *mcp-build
      additional_contexts:
        app: services/mcp-docs/app
    container_name: mcp-docs
    environment:
      PORT: 8203
    ports:
      - "8203:8203"
