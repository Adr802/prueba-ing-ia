[project]
name = "onboarding-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "aiokafka>=0.11",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-groq>=1.1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
